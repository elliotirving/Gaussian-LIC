# Oxford-Spires (alphasense cam0, rectified). Mimics config/r3live.yaml; camera
# and scene values come from large_scale_gaussian_slam's oxspires configs.
#
# /cam0/image_rect is a PinHole (distortion-free) rectified stream at native
# resolution 1440x1080, with intrinsics (from
# cfg/ORB_SLAM3/Monocular/Oxspires/alphasense_cam0_rectified.yaml):
#   full (1440x1080): fx 532.4239188382905  fy 532.6874345419984
#                     cx 701.3267418181715  cy 571.7953118187404
#
# 1440x1080 is exactly 4:3, and 640x480 = 1440x1080 * 4/9 EXACTLY (640/1440 ==
# 480/1080 == 4/9), so no crop is needed: both axes scale by the same factor and
# every intrinsic scales cleanly. 640x480 also matches a built SPNet engine
# (ckpt/spnet_480_640.engine — the engine is auto-selected from width/height in
# src/mapping.h). The other built engines are 640x512 and 800x640.
#
#   scale 4/9:  fx/fy/cx/cy * 4/9   (crop_y = 0)
#
# eval/cameras.json is written at full input resolution, not the training
# resolution below. Nothing extra is configured for it: Dataset::addFrame()
# measures the incoming image straight off the ROS topic (before any crop or
# resize), and evaluationGeometry() undoes crop_y and the resize to recover
# the full-resolution intrinsics. Training is unaffected.
crop_y: 0
width: 640
height: 480
fx: 236.6328528170
fy: 236.7499709076
cx: 311.7007741414
cy: 254.1312496972

select_every_k_frame: 5
point_stride: 1          # take every Nth point from /points_for_gs (1 = all points)
depth_completion: true
patch_size: 10
max_depth: 60  # outdoor college scene; matches lsgs oxspires z_far / max_depth 60

sh_degree: 3
white_background: false  # no adjustment needed
random_background: false  # no adjustment needed
convert_SHs_python: false  # no adjustment needed
compute_cov3D_python: false  # no adjustment needed
lambda_erank: 0  # no adjustment needed
scaling_scale: 2  # the larger value tends to yield less Gaussians

position_lr: 0.00016
feature_lr: 0.0050  # the larger value tends to yield better performance
opacity_lr: 0.05
scaling_lr: 0.015  # the larger value tends to yield less Gaussians
rotation_lr: 0.001
lambda_dssim: 0.2
optimize_depth: true
lambda_depth: 0.005
iteration_decay: true
max_iters: 100  # max cameras optimized per keyframe in optimize()

apply_exposure: false
exposure_lr: 0.001
skybox_points_num: 0  # 100000
skybox_radius: 1000
